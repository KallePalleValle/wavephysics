<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Single-Slit Diffraction — Phasor Demonstration</title>
<style>
  :root {
    --bg: #f4f1ea;
    --ink: #1a1a1a;
    --paper: #faf8f3;
    --accent: #b8341f;
    --wave: #2c5f7c;
    --resultant: #b8341f;
    --grid: #d8d2c4;
    --muted: #6b6459;
    --rule: #2a2520;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    height: 100vh;
    overflow: hidden;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(184, 52, 31, 0.03) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(44, 95, 124, 0.04) 0%, transparent 40%);
  }
  body { display: flex; flex-direction: column; }
  header {
    border-bottom: 2px solid var(--rule);
    padding: 14px 32px 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 30px;
    flex-shrink: 0;
    position: relative;
  }
  header::before {
    content: "";
    position: absolute;
    top: 4px; left: 32px; right: 32px;
    height: 1px;
    background: var(--rule);
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.5px;
    line-height: 1;
  }
  h1 em { font-style: italic; color: var(--accent); }
  .subtitle {
    font-family: Consolas, "Courier New", monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: var(--muted);
  }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 20px;
    padding: 18px 32px;
    min-height: 0;
    overflow: hidden;
  }
  .stage {
    display: grid;
    grid-template-rows: minmax(0, 1fr) minmax(0, 1.4fr);
    gap: 18px;
    min-height: 0;
  }
  .panel {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 14px 18px 12px;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel-label {
    position: absolute;
    top: -9px;
    left: 18px;
    background: var(--bg);
    padding: 0 10px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .panel-title {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .panel-title em { font-weight: 600; color: var(--ink); }
  .svg-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg { display: block; width: 100%; height: 100%; max-height: 100%; }

  aside { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .control-group {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 14px 18px;
  }
  .control-group h3 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--grid);
  }
  label {
    display: block;
    font-family: Consolas, "Courier New", monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .value {
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
  }
  .slider-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 2px;
    background: var(--rule);
    outline: none;
    margin-bottom: 14px;
  }
  input[type="range"]:last-child { margin-bottom: 2px; }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px; height: 16px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid var(--paper);
    box-shadow: 0 0 0 1px var(--rule);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid var(--paper);
    box-shadow: 0 0 0 1px var(--rule);
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-top: 6px;
    flex-shrink: 0;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 14px; height: 3px; }
  .signature {
    position: fixed;
    right: 14px;
    bottom: 8px;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.5px;
    pointer-events: none;
  }
</style>
</head>
<body>

<header>
  <h1>Single-Slit Diffraction</h1>
  
</header>

<main>
  <div class="stage">

    <div class="panel">
      <span class="panel-label">Wavefronts, Slit, & Intensity Pattern</span>
      <div class="svg-wrap">
        <svg id="waveSvg" viewBox="0 0 1100 380" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="swatch" style="background: var(--wave);"></div>Incident wavefront</div>
        <div class="legend-item"><div class="swatch" style="background: var(--accent);"></div>Slit aperture (b)</div>
        <div class="legend-item"><div class="swatch" style="background: var(--ink);"></div>Diffracted ray (θ)</div>
        <div class="legend-item"><div class="swatch" style="background: var(--accent); opacity: 0.35;"></div>I(θ)/I₀</div>
      </div>
    </div>

    <div class="panel">
      <span class="panel-label">From Path Difference to Phasor Sum</span>
      <div class="svg-wrap">
        <svg id="phasorSvg" viewBox="0 0 1100 520" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="legend">
        <div class="legend-item">
          <div class="swatch" style="background: repeating-linear-gradient(to right, var(--wave) 0 4px, transparent 4px 7px); opacity: 0.75;"></div>
          Reference wavefront
        </div>
      </div>
    </div>

  </div>

  <aside>
    <div class="control-group">
      <h3>Parameters</h3>

      <div class="slider-row">
        <label>Slit width <span style="text-transform:none; letter-spacing:0;">b / λ</span></label>
        <span class="value" id="bVal">4.0</span>
      </div>
      <input type="range" id="bSlider" min="1" max="12" step="0.1" value="4">

      <div class="slider-row">
        <label>Phasors <span style="text-transform:none; letter-spacing:0;">N</span></label>
        <span class="value" id="nVal">5</span>
      </div>
      <input type="range" id="nSlider" min="5" max="40" step="1" value="5">

      <div class="slider-row">
        <label>Angle <span style="text-transform:none; letter-spacing:0;">θ (deg)</span></label>
        <span class="value" id="angVal">0.0°</span>
      </div>
      <input type="range" id="angSlider" min="0" max="15" step="0.1" value="0">
    </div>
  </aside>
</main>

<div class="signature">RM</div>

<script>
const state = { b: 4.0, N: 5, theta: 0.0 };

const bSlider = document.getElementById('bSlider');
const nSlider = document.getElementById('nSlider');
const angSlider = document.getElementById('angSlider');
const bVal = document.getElementById('bVal');
const nVal = document.getElementById('nVal');
const angVal = document.getElementById('angVal');

bSlider.addEventListener('input', e => { state.b = parseFloat(e.target.value); render(); });
nSlider.addEventListener('input', e => { state.N = parseInt(e.target.value); render(); });
angSlider.addEventListener('input', e => { state.theta = parseFloat(e.target.value); render(); });

function physics() {
  const thetaRad = state.theta * Math.PI / 180;
  // Chain model (midpoint rule): N phasors at strip centers y_i = (i+0.5)·b/N, i = 0..N-1.
  // Spacing between adjacent phasors = b/N. Phase step:
  //   Δφ = (2π/λ)·(b/N)·sinθ
  // At first minimum (b·sinθ = 1), Δφ = 2π/N and N phasors form the Nth roots of unity,
  // summing to exactly 0 — the polygon closes. This is the correct discretization.
  const dphi = (2 * Math.PI) * (state.b / state.N) * Math.sin(thetaRad);
  const totPhi = state.N * dphi;
  let amp;
  if (Math.abs(dphi) < 1e-10) amp = 1.0;
  else amp = Math.sin(state.N * dphi / 2) / (state.N * Math.sin(dphi / 2));
  return { thetaRad, dphi, totPhi, amp, intensity: amp * amp };
}

// Color palette for the 5 marker phasors / dials / sine rays.
// t is in [0,1]; we snap to the nearest of 5 colors (blue → green → yellow → orange → red).
const markerPalette = ['#2563c8', '#2f9e44', '#c9a227', '#d97420', '#c0322b'];
function phasorColor(t) {
  const k = Math.round(t * (markerPalette.length - 1));
  return markerPalette[Math.max(0, Math.min(markerPalette.length - 1, k))];
}

function render() {
  bVal.textContent = state.b.toFixed(1);
  nVal.textContent = state.N;
  angVal.textContent = state.theta.toFixed(1) + '°';
  const p = physics();
  drawWaveAndIntensity(p);
  drawPhasors(p);
}

// ============================================================
// FIG 01 — Wave, slit, intensity pattern
// ============================================================
function drawWaveAndIntensity(p) {
  const W = 1100, H = 380;
  const slitX = 430;
  const screenX = 920;
  const cy = H / 2;
  const slitPx = Math.min(180, Math.max(24, state.b * 14));
  const topSlit = cy - slitPx / 2;
  const botSlit = cy + slitPx / 2;

  const svg = document.getElementById('waveSvg');
  let s = '';

  s += `<defs>
    <pattern id="gridp" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="var(--grid)" stroke-width="0.5"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ink)"/>
    </marker>
  </defs>`;
  s += `<rect width="${W}" height="${H}" fill="url(#gridp)"/>`;

  const lamPx = 38;
  const nWaves = 4;
  const firstX = slitX - nWaves * lamPx - 20;
  for (let i = 0; i < nWaves; i++) {
    const x = firstX + i * lamPx;
    const opacity = 0.35 + i * 0.12;
    s += `<line x1="${x}" y1="30" x2="${x}" y2="${H - 30}" stroke="var(--wave)" stroke-width="2" opacity="${opacity}"/>`;
  }
  for (let y of [70, 190, 310]) {
    s += `<line x1="${firstX - 40}" y1="${y}" x2="${firstX - 10}" y2="${y}" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#arr)"/>`;
  }
  s += `<line x1="${firstX}" y1="20" x2="${firstX + lamPx}" y2="20" stroke="var(--muted)" stroke-width="1"/>`;
  s += `<line x1="${firstX}" y1="16" x2="${firstX}" y2="24" stroke="var(--muted)" stroke-width="1"/>`;
  s += `<line x1="${firstX + lamPx}" y1="16" x2="${firstX + lamPx}" y2="24" stroke="var(--muted)" stroke-width="1"/>`;
  s += `<text x="${firstX + lamPx/2}" y="14" font-family="Cormorant Garamond" font-style="italic" font-size="14" fill="var(--muted)" text-anchor="middle">λ</text>`;

  s += `<rect x="${slitX - 6}" y="30" width="12" height="${topSlit - 30}" fill="var(--ink)"/>`;
  s += `<rect x="${slitX - 6}" y="${botSlit}" width="12" height="${H - 30 - botSlit}" fill="var(--ink)"/>`;
  for (let y = 34; y < topSlit - 4; y += 9) {
    s += `<line x1="${slitX - 14}" y1="${y + 7}" x2="${slitX - 6}" y2="${y}" stroke="var(--ink)" stroke-width="0.8"/>`;
  }
  for (let y = botSlit + 4; y < H - 30; y += 9) {
    s += `<line x1="${slitX - 14}" y1="${y + 7}" x2="${slitX - 6}" y2="${y}" stroke="var(--ink)" stroke-width="0.8"/>`;
  }

  s += `<line x1="${slitX - 30}" y1="${topSlit}" x2="${slitX - 30}" y2="${botSlit}" stroke="var(--accent)" stroke-width="1.2"/>`;
  s += `<line x1="${slitX - 34}" y1="${topSlit}" x2="${slitX - 26}" y2="${topSlit}" stroke="var(--accent)" stroke-width="1.2"/>`;
  s += `<line x1="${slitX - 34}" y1="${botSlit}" x2="${slitX - 26}" y2="${botSlit}" stroke="var(--accent)" stroke-width="1.2"/>`;
  s += `<text x="${slitX - 40}" y="${cy + 5}" font-family="Cormorant Garamond" font-style="italic" font-size="18" fill="var(--accent)" text-anchor="end">b = ${state.b.toFixed(1)}λ</text>`;

  const nVis = Math.min(state.N, 40);
  for (let i = 0; i < nVis; i++) {
    const y = topSlit + (i + 0.5) * (slitPx / nVis);
    // Forward-facing half circles (Huygens secondary wavelets): from (slitX, y-r) round
    // the +x side to (slitX, y+r). This is physically cleaner — a single semicircle per radius.
    for (let r of [16, 32, 48]) {
      s += `<path d="M ${slitX} ${y - r} A ${r} ${r} 0 0 1 ${slitX} ${y + r}" fill="none" stroke="var(--wave)" stroke-width="0.7" opacity="0.3"/>`;
    }
    s += `<circle cx="${slitX}" cy="${y}" r="1.8" fill="var(--accent)"/>`;
  }

  const D = screenX - slitX;
  const maxLobeWidth = 120;
  s += `<line x1="${screenX}" y1="40" x2="${screenX}" y2="${H - 40}" stroke="var(--ink)" stroke-width="2"/>`;
  s += `<text x="${screenX}" y="32" font-family="JetBrains Mono" font-size="9" fill="var(--muted)" letter-spacing="1.5" text-anchor="middle">SCREEN</text>`;

  const intensityPoints = [];
  const steps = 200;
  for (let i = 0; i <= steps; i++) {
    const y = 40 + (H - 80) * (i / steps);
    const dy = y - cy;
    const thetaRad = Math.atan2(dy, D);
    // Ideal Fraunhofer single-slit intensity (continuous limit, independent of N):
    //   I(θ)/I₀ = [sin(β)/β]²  with β = π·(b/λ)·sinθ
    const beta = Math.PI * state.b * Math.sin(thetaRad);
    let amp;
    if (Math.abs(beta) < 1e-10) amp = 1;
    else amp = Math.sin(beta) / beta;
    intensityPoints.push({ y, I: amp * amp });
  }

  let fillPath = `M ${screenX} ${intensityPoints[0].y} `;
  for (const pt of intensityPoints) {
    fillPath += `L ${screenX - pt.I * maxLobeWidth} ${pt.y} `;
  }
  fillPath += `L ${screenX} ${intensityPoints[intensityPoints.length - 1].y} Z`;
  s += `<path d="${fillPath}" fill="var(--accent)" opacity="0.18"/>`;

  let curvePath = '';
  for (let i = 0; i < intensityPoints.length; i++) {
    const pt = intensityPoints[i];
    curvePath += (i === 0 ? 'M' : 'L') + (screenX - pt.I * maxLobeWidth).toFixed(1) + ' ' + pt.y.toFixed(1) + ' ';
  }
  s += `<path d="${curvePath}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;

  s += `<line x1="${screenX - maxLobeWidth}" y1="${H - 28}" x2="${screenX}" y2="${H - 28}" stroke="var(--muted)" stroke-width="0.8"/>`;
  s += `<line x1="${screenX - maxLobeWidth}" y1="${H - 32}" x2="${screenX - maxLobeWidth}" y2="${H - 24}" stroke="var(--muted)" stroke-width="0.8"/>`;
  s += `<line x1="${screenX}" y1="${H - 32}" x2="${screenX}" y2="${H - 24}" stroke="var(--muted)" stroke-width="0.8"/>`;
  s += `<text x="${screenX - maxLobeWidth - 4}" y="${H - 22}" font-family="JetBrains Mono" font-size="9" fill="var(--muted)" text-anchor="end">I/I₀ = 1</text>`;
  s += `<text x="${screenX + 4}" y="${H - 22}" font-family="JetBrains Mono" font-size="9" fill="var(--muted)">0</text>`;

  const thRad = state.theta * Math.PI / 180;
  // Visual convention: positive θ displayed going UP on screen (screen y is down, so negate).
  const thRadVis = -thRad;
  const rayEndY = cy + D * Math.tan(thRadVis);
  s += `<line x1="${slitX}" y1="${cy}" x2="${screenX}" y2="${rayEndY}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>`;
  s += `<line x1="${slitX}" y1="${cy}" x2="${screenX}" y2="${cy}" stroke="var(--muted)" stroke-width="0.8" stroke-dasharray="2 3"/>`;

  if (Math.abs(state.theta) > 0.5) {
    const ar = 60;
    const sweep = thRadVis > 0 ? 1 : 0;
    const ex = slitX + ar * Math.cos(thRadVis);
    const ey = cy + ar * Math.sin(thRadVis);
    s += `<path d="M ${slitX + ar} ${cy} A ${ar} ${ar} 0 0 ${sweep} ${ex} ${ey}" fill="none" stroke="var(--accent)" stroke-width="1.2"/>`;
    const tx = slitX + (ar + 22) * Math.cos(thRadVis / 2);
    const ty = cy + (ar + 22) * Math.sin(thRadVis / 2);
    s += `<text x="${tx}" y="${ty + 5}" font-family="Cormorant Garamond" font-style="italic" font-size="18" fill="var(--accent)" text-anchor="middle">θ</text>`;
  }

  // Current intensity dot: use ideal sinc² (same formula as the displayed curve, symmetric in θ)
  const betaCur = Math.PI * state.b * Math.sin(thRad);
  const ampCur = (Math.abs(betaCur) < 1e-10) ? 1 : Math.sin(betaCur) / betaCur;
  const curI = ampCur * ampCur;
  const curY = cy + D * Math.tan(thRadVis);
  if (curY >= 40 && curY <= H - 40) {
    s += `<line x1="${screenX - curI * maxLobeWidth}" y1="${curY}" x2="${screenX}" y2="${curY}" stroke="var(--ink)" stroke-width="1" opacity="0.5"/>`;
    s += `<circle cx="${screenX - curI * maxLobeWidth}" cy="${curY}" r="5" fill="var(--ink)"/>`;
    s += `<circle cx="${screenX - curI * maxLobeWidth}" cy="${curY}" r="2.5" fill="var(--paper)"/>`;
    // Readout placed to the RIGHT of the screen, near the dashed-ray arrowhead that lands there.
    s += `<text x="${screenX + 10}" y="${curY + 4}" font-family="JetBrains Mono" font-size="11" fill="var(--ink)" font-weight="500">I/I₀ = ${curI.toFixed(3)}</text>`;
  }

  s += `<text x="${firstX}" y="${H - 10}" font-family="JetBrains Mono" font-size="10" fill="var(--muted)" letter-spacing="1.5">INCIDENT PLANE WAVE →</text>`;
  s += `<text x="${slitX + 40}" y="${H - 10}" font-family="JetBrains Mono" font-size="10" fill="var(--muted)" letter-spacing="1.5">FAR FIELD</text>`;

  svg.innerHTML = s;
}

// ============================================================
// FIG 02 — Magnified slit (with dials) + phasor sum
// ============================================================
function drawPhasors(p) {
  const W = 1100, H = 520;
  const svg = document.getElementById('phasorSvg');
  let s = '';

  // ---------- Layout ----------
  // LEFT part (x: 0..540): dials at x=60, slit at x=220, rays extend to ~x=520
  // RIGHT part (x: 580..1100): phasor chain with START at x=620
  const dialCx = 60;
  const dialR = 26;
  const slitCx = 220;
  const slitTopY = 90;
  const slitBotY = 420;
  const slitMagHeight = slitBotY - slitTopY;

  // Number of dials (fixed pedagogical count)
  const M = 5;

  // ---------- Picking which chain-phasors are "marker" phasors ----------
  // Dials sit at fractional slit positions (k+0.5)/M for k=0..M-1 (strip centers of an M-division).
  // Chain phasors sit at fractional positions (j+0.5)/N for j=0..N-1.
  // The chain index closest to dial k is the j minimizing |(j+0.5)/N − (k+0.5)/M|,
  // which gives j = round((k+0.5)·N/M − 0.5).
  const markerIdx = [];
  for (let k = 0; k < M; k++) {
    markerIdx.push(Math.max(0, Math.min(state.N - 1,
      Math.round((k + 0.5) * state.N / M - 0.5))));
  }
  // Helper: which dial color does chain-index i get?
  const colorForChainIdx = new Map();
  for (let k = 0; k < M; k++) colorForChainIdx.set(markerIdx[k], k);

  // ========== LEFT: Magnified slit + sources + dials + rays ==========
  // Barrier (slit opening vertical with hatching top/bottom)
  s += `<line x1="${slitCx - 4}" y1="${slitTopY - 30}" x2="${slitCx - 4}" y2="${slitTopY}" stroke="var(--ink)" stroke-width="8"/>`;
  s += `<line x1="${slitCx - 4}" y1="${slitBotY}" x2="${slitCx - 4}" y2="${slitBotY + 30}" stroke="var(--ink)" stroke-width="8"/>`;
  for (let y = slitTopY - 28; y < slitTopY - 2; y += 7) {
    s += `<line x1="${slitCx - 14}" y1="${y + 6}" x2="${slitCx - 4}" y2="${y}" stroke="var(--ink)" stroke-width="0.8"/>`;
  }
  for (let y = slitBotY + 2; y < slitBotY + 28; y += 7) {
    s += `<line x1="${slitCx - 14}" y1="${y + 6}" x2="${slitCx - 4}" y2="${y}" stroke="var(--ink)" stroke-width="0.8"/>`;
  }

  // Ray geometry
  const rayLen = 280;
  const thRad = p.thetaRad;
  // Visual convention: rays swivel UPWARD for positive θ (screen y is down, so negate).
  // All ray/wavefront drawing uses thRadVis; the actual physical phase (via p.amp) is unchanged.
  const thRadVis = -thRad;

  // With rays going up-right (for positive θ), the wavefront is anchored at the TOP dial
  // (center of the 1st of M strips) and extends toward where the lower dials' rays will cross it.
  // That direction is perpendicular to the rays and points "down-right" on screen:
  //   perpDir = (-sin(θv), cos(θv))   (rotated 90° CW from ray direction)
  // For θv<0 (rays up-right), this gives (+,+) — toward the lower-right, matching the pattern
  // of where lower sources' rays cross the wavefront plane.
  const topDialFrac = 0.5 / M;
  const wfAnchorX = slitCx;
  const wfAnchorY = slitTopY + topDialFrac * slitMagHeight;
  const perpDx = -Math.sin(thRadVis);
  const perpDy = Math.cos(thRadVis);

  // Reference wavefront — extends from the top dial toward the lower-ray-crossing region.
  const wfLen = (1 - 2 * topDialFrac) * slitMagHeight + 20;
  const wfX2 = wfAnchorX + perpDx * wfLen;
  const wfY2 = wfAnchorY + perpDy * wfLen;
  s += `<line x1="${wfAnchorX.toFixed(1)}" y1="${wfAnchorY.toFixed(1)}" x2="${wfX2.toFixed(1)}" y2="${wfY2.toFixed(1)}" stroke="var(--wave)" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.75"/>`;

  // Visual wavelength: b wavelengths across the slit
  const lamVis = slitMagHeight / state.b;
  const waveAmpPx = 6;
  const waveSteps = 120;

  // ---------- Draw N sine-line sources across the slit ----------
  // Cap how many we actually draw so it doesn't get visually overwhelming
  const nSineDraw = Math.min(state.N, 40);
  const drawnIndices = [];
  if (nSineDraw === state.N) {
    for (let j = 0; j < state.N; j++) drawnIndices.push(j);
  } else {
    // Evenly sample nSineDraw indices from [0, N-1], and ALWAYS include the marker indices
    // so the 5 colored rays are always visible
    const set = new Set(markerIdx);
    for (let k = 0; k < nSineDraw; k++) {
      set.add(Math.round(k * (state.N - 1) / (nSineDraw - 1)));
    }
    const arr = [...set];
    arr.sort((a, b) => a - b);
    for (const v of arr) drawnIndices.push(v);
  }

  // Slit source dots + sine lines (each ray represents the CENTER of strip j, N strips total)
  for (const j of drawnIndices) {
    const frac = (j + 0.5) / state.N;
    const srcY = slitTopY + frac * slitMagHeight;
    const isMarker = colorForChainIdx.has(j);
    const markerK = colorForChainIdx.get(j);
    const col = isMarker ? phasorColor(markerK / (M - 1)) : '#8a857a';
    const op = isMarker ? 0.9 : 0.45;
    const sw = 1.2;  // same width for all

    // Sine wave path: phase 0 at source, phase = -2π·t/λ_vis along ray
    let path = '';
    for (let k = 0; k <= waveSteps; k++) {
      const tt = (k / waveSteps) * rayLen;
      const phase = -(2 * Math.PI) * tt / lamVis;
      const off = waveAmpPx * Math.sin(phase);
      const px = slitCx + tt * Math.cos(thRadVis) + off * perpDx;
      const py = srcY + tt * Math.sin(thRadVis) + off * perpDy;
      path += (k === 0 ? 'M' : 'L') + px.toFixed(2) + ' ' + py.toFixed(2) + ' ';
    }
    s += `<path d="${path}" fill="none" stroke="${col}" stroke-width="${sw}" opacity="${op}"/>`;

    // Source dot
    const dotR = isMarker ? 4 : 2;
    s += `<circle cx="${slitCx}" cy="${srcY}" r="${dotR}" fill="${col}" stroke="var(--paper)" stroke-width="${isMarker ? 1.5 : 0.5}"/>`;
  }

  // ---------- Dials (M of them, fixed) ----------
  // Each dial represents the CENTER of strip k (of M strips). Phase is measured relative
  // to the top dial (where the reference wavefront is anchored), so dial 0 reads 0°.
  for (let k = 0; k < M; k++) {
    const frac = (k + 0.5) / M;
    const dialCy = slitTopY + frac * slitMagHeight;
    const col = phasorColor(k / (M - 1));
    // Phase relative to top dial: source offset below top dial × sinθ, in λ units.
    // (frac − topDialFrac)·slitMagHeight is the pixel offset; dividing by lamVis = slitMagHeight/b
    // gives the offset in λ units. So:
    //   φ = 2π · (frac − topDialFrac) · b · sinθ
    const phi = 2 * Math.PI * (frac - topDialFrac) * state.b * Math.sin(thRad);

    // Dial circle
    s += `<circle cx="${dialCx}" cy="${dialCy}" r="${dialR}" fill="var(--paper)" stroke="var(--rule)" stroke-width="1"/>`;
    s += `<line x1="${dialCx - dialR}" y1="${dialCy}" x2="${dialCx + dialR}" y2="${dialCy}" stroke="var(--grid)" stroke-width="0.7"/>`;
    s += `<line x1="${dialCx}" y1="${dialCy - dialR}" x2="${dialCx}" y2="${dialCy + dialR}" stroke="var(--grid)" stroke-width="0.7"/>`;
    // Arrow — rotation direction: positive phi rotates CCW on screen (y-down → negate sin)
    const endX = dialCx + (dialR - 4) * Math.cos(phi);
    const endY = dialCy - (dialR - 4) * Math.sin(phi);
    s += `<line x1="${dialCx}" y1="${dialCy}" x2="${endX.toFixed(2)}" y2="${endY.toFixed(2)}" stroke="${col}" stroke-width="2.4" stroke-linecap="round"/>`;
    s += `<circle cx="${endX.toFixed(2)}" cy="${endY.toFixed(2)}" r="2.6" fill="${col}"/>`;
    // Phase readout under dial
    const phaseDeg = ((phi * 180 / Math.PI) % 360 + 360) % 360;
    s += `<text x="${dialCx}" y="${dialCy + dialR + 13}" font-family="JetBrains Mono" font-size="9" fill="var(--muted)" text-anchor="middle">${phaseDeg.toFixed(0)}°</text>`;
  }

  // Section labels at top of panel
  s += `<text x="${dialCx}" y="${slitTopY - 45}" font-family="JetBrains Mono" font-size="9" fill="var(--muted)" letter-spacing="1.5" text-anchor="middle">PHASOR DIALS</text>`;
  s += `<text x="${slitCx + 90}" y="${slitTopY - 45}" font-family="JetBrains Mono" font-size="9" fill="var(--muted)" letter-spacing="1.5">RAYS AT ANGLE θ · ${state.N} SOURCES${nSineDraw < state.N ? ` (SHOWING ${nSineDraw})` : ''}</text>`;

  // Divider
  s += `<line x1="560" y1="30" x2="560" y2="${H - 30}" stroke="var(--grid)" stroke-width="1" stroke-dasharray="2 5"/>`;

  // ========== RIGHT: phasor chain ==========
  s += `<text x="600" y="26" font-family="JetBrains Mono" font-size="10" fill="var(--muted)" letter-spacing="1.8">PHASOR SUM · N = ${state.N}  ·  Δφ = ${(p.dphi * 180 / Math.PI).toFixed(2)}°</text>`;
  // Pin START. Chain curls UPWARD (CCW) from horizontal, so place START low to give room.
  const startX = 620;
  const startY = 420;

  const totalLen = 360;
  const unitLen = totalLen / state.N;

  // Chain rotation: positive dphi rotates CCW on screen (y-axis is down → negate sin).
  // Chain curls upward from START.
  const pts = [{ x: startX, y: startY }];
  let cx2 = startX, cy2 = startY;
  let ang = 0;
  for (let i = 0; i < state.N; i++) {
    cx2 += unitLen * Math.cos(ang);
    cy2 -= unitLen * Math.sin(ang);
    pts.push({ x: cx2, y: cy2 });
    ang += p.dphi;
  }

  // Arrowhead sizing: fixed for N ≤ 16, shrinking above
  const Neff = Math.max(state.N, 16);
  const arrowSize = Math.max(3, Math.min(12, 70 / Neff));
  const strokeW = Math.max(1.3, Math.min(2.6, 32 / Neff));

  s += `<defs>
    <marker id="phArrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="${arrowSize}" markerHeight="${arrowSize}" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6459"/>
    </marker>
    <marker id="resArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--resultant)"/>
    </marker>
  </defs>`;

  // We also need per-color arrowhead markers for the 5 marker phasors. Define them inline,
  // all the same size as the gray arrowhead marker.
  for (let k = 0; k < M; k++) {
    const col = phasorColor(k / (M - 1));
    s += `<defs>
      <marker id="phArrC${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="${arrowSize}" markerHeight="${arrowSize}" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="${col}"/>
      </marker>
    </defs>`;
  }

  const shortenBy = Math.min(unitLen * 0.22, arrowSize * 1.0);

  for (let i = 0; i < state.N; i++) {
    const a = pts[i], bpt = pts[i + 1];
    const dx = bpt.x - a.x, dy = bpt.y - a.y;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const ex = bpt.x - (dx / len) * shortenBy;
    const ey = bpt.y - (dy / len) * shortenBy;

    const isMarker = colorForChainIdx.has(i);
    if (isMarker) {
      const k = colorForChainIdx.get(i);
      const col = phasorColor(k / (M - 1));
      s += `<line x1="${a.x.toFixed(2)}" y1="${a.y.toFixed(2)}" x2="${ex.toFixed(2)}" y2="${ey.toFixed(2)}" stroke="${col}" stroke-width="${strokeW}" stroke-linecap="butt" marker-end="url(#phArrC${k})"/>`;
    } else {
      s += `<line x1="${a.x.toFixed(2)}" y1="${a.y.toFixed(2)}" x2="${ex.toFixed(2)}" y2="${ey.toFixed(2)}" stroke="#6b6459" stroke-width="${strokeW}" stroke-linecap="butt" marker-end="url(#phArrGray)"/>`;
    }
  }

  // START marker
  s += `<circle cx="${pts[0].x}" cy="${pts[0].y}" r="6" fill="var(--ink)"/>`;
  s += `<circle cx="${pts[0].x}" cy="${pts[0].y}" r="2.5" fill="var(--paper)"/>`;
  s += `<text x="${pts[0].x - 12}" y="${pts[0].y + 4}" font-family="JetBrains Mono" font-size="10" fill="var(--muted)" text-anchor="end" font-weight="500">START</text>`;

  // END marker
  s += `<circle cx="${pts[state.N].x}" cy="${pts[state.N].y}" r="5" fill="var(--accent)"/>`;
  s += `<circle cx="${pts[state.N].x}" cy="${pts[state.N].y}" r="2" fill="var(--paper)"/>`;

  // Resultant arrow
  const start = pts[0], end = pts[state.N];
  const rdx = end.x - start.x, rdy = end.y - start.y;
  const rlen = Math.sqrt(rdx * rdx + rdy * rdy);
  if (rlen > 4) {
    const shortenRes = 8;
    const rex = end.x - (rdx / rlen) * shortenRes;
    const rey = end.y - (rdy / rlen) * shortenRes;
    s += `<line x1="${start.x}" y1="${start.y}" x2="${rex}" y2="${rey}" stroke="var(--resultant)" stroke-width="2" marker-end="url(#resArr)" opacity="0.95"/>`;
  }

  // Fixed-position E(θ) readout above the chain graphic
  const readoutCx = 840;
  const readoutY = 50;
  s += `<text x="${readoutCx}" y="${readoutY}" font-family="Cormorant Garamond" font-style="italic" font-size="24" fill="var(--resultant)" text-anchor="middle" font-weight="600">E(θ)</text>`;
  s += `<text x="${readoutCx}" y="${readoutY + 22}" font-family="JetBrains Mono" font-size="12" fill="var(--resultant)" text-anchor="middle">|E| / E₀ = ${Math.abs(p.amp).toFixed(3)}</text>`;

  svg.innerHTML = s;
}

render();
window.addEventListener('resize', render);
</script>

</body>
</html>
